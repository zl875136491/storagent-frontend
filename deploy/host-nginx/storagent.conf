# Every regional host resolves stor.1oa.com.cn to itself.
# Nginx is the sole public ingress: the frontend listens only on 127.0.0.1:8080,
# while all backend traffic uses one of the explicit /server/{region} prefixes.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stor.1oa.com.cn _;

    client_max_body_size 0;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `local` must remain local on every host; the named routes intentionally
    # use the private regional addresses so the same config can be deployed everywhere.
    location ^~ /server/local/ { proxy_pass http://127.0.0.1:6783/; include /etc/nginx/snippets/storagent-proxy.conf; }
    location ^~ /server/bj/ { proxy_pass http://10.32.129.241:6783/; include /etc/nginx/snippets/storagent-proxy.conf; }
    location ^~ /server/tj/ { proxy_pass http://10.17.158.115:6783/; include /etc/nginx/snippets/storagent-proxy.conf; }
    location ^~ /server/ks/ { proxy_pass http://10.8.136.107:6783/; include /etc/nginx/snippets/storagent-proxy.conf; }
    location ^~ /server/sz/ { proxy_pass http://10.41.102.223:6783/; include /etc/nginx/snippets/storagent-proxy.conf; }
    location ^~ /server/hz/ { proxy_pass http://10.31.133.207:6783/; include /etc/nginx/snippets/storagent-proxy.conf; }

    location = /server/local { return 308 /server/local/; }
    location = /server/bj { return 308 /server/bj/; }
    location = /server/tj { return 308 /server/tj/; }
    location = /server/ks { return 308 /server/ks/; }
    location = /server/sz { return 308 /server/sz/; }
    location = /server/hz { return 308 /server/hz/; }

    # Do not let an unrecognised backend prefix fall through to the SPA.
    # A typo such as /server/bjj/... must be visible to callers as a 404.
    location ^~ /server/ { return 404; }

    # All remaining routes, including the SPA fallback, are served by the
    # Docker frontend through its loopback-only publication.
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/storagent-proxy.conf;
    }
}
